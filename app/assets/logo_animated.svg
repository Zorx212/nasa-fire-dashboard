<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Flame in Freefall" xmlns:c2pa="http://c2pa.org/manifest"><style>.ff-fl{transform-box:fill-box;transform-origin:50% 100%;animation:ff-k 3.4s ease-in-out infinite}
.ff-sp{transform-box:fill-box;transform-origin:50% 50%;animation:ff-b 6.8s ease-in-out infinite}
@keyframes ff-k{0%,100%{transform:scale(1,1)}40%{transform:scale(.96,1.07)}70%{transform:scale(1.03,.97)}}
@keyframes ff-b{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.ff-fl,.ff-sp{animation:none}}</style>
