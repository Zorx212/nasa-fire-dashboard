<path d="M5 32 A27 10 0 0 0 59 32" stroke="#0F172A" stroke-width="1.6"/><circle r="2.5" fill="#0F172A"><animateMotion dur="9s" repeatCount="indefinite" path="M5 32 A27 10 0 0 0 59 32 A27 10 0 0 0 5 32"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="9s" repeatCount="indefinite"/></circle></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>